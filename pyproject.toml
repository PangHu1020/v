[project]
name = "v-agent-platform"
version = "0.1.0"
description = "LangGraph + FastAPI external customer-service agent platform over WeCom + Feishu."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pgvector>=0.3",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph-checkpoint>=2.1,<4.0",
    "langgraph-checkpoint-postgres>=2.0,<3.0",
    "slack-sdk>=3.36",
    "mcp>=1.0",
    "arq>=0.26",
    "structlog>=24.0",
    "tenacity>=9.0",
    "orjson>=3.10",
    "cryptography>=43.0",
    "mmh3>=5.0",
    "python-multipart>=0.0.9",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "fakeredis>=2.24",
    "respx>=0.21",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "pytest-postgresql>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/sql", ".claude"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "N",
    "ASYNC",
    "S",
    "RUF",
]
ignore = [
    "S101",
    "S104",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"backend/test/**/*.py" = ["S", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/test"]
addopts = "--strict-markers -ra"
markers = [
    "e2e: end-to-end tests requiring full FastAPI lifespan",
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["backend"]
branch = true
omit = [
    "backend/test/*",
    "backend/eval/*",
    "backend/__init__.py",
    "backend/app/__init__.py",
    "backend/v/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"