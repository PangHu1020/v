# v-agent-platform — runtime configuration
#
# Copy to config.yaml and edit. Everything here is a NON-SECRET tunable:
# model names, thresholds, TTLs, shard counts. Editing this file changes
# behaviour without touching code.
#
# Secrets (API keys, DSNs, bot credentials) belong in .env, NOT here.
#
# Precedence (highest wins):  env var  >  .env  >  config.yaml  >  code default
# Section names below map 1:1 to AppSettings fields (resolved by reflection).
# Point a different file via the APP_CONFIG_FILE env var.

runtime:
  env: dev                 # dev | prod — controls JSON logging
  log_level: INFO          # DEBUG | INFO | WARNING | ERROR

llm:
  # base_url_* / api_key_* are secrets → set in .env
  main_primary: deepseek-v4-flash      # main reasoning model
  main_fallback: qwen3.6-plus       # same-family fallback on timeout/5xx/429
  timeout_seconds: 30                  # per-call timeout before fallback

embedding:
  model: text-embedding-v4             # DashScope Qwen embedding
  dim: 1024                            # must match Milvus collection dim

memory:
  working_ttl_seconds: 1800            # Redis working-memory TTL (= session window)
  event_ttl_days: 30                   # event_memory recall window
  recent_events_to_inject: 3           # event rows injected at session start
  compression_threshold_tokens: 4000   # mid-session compression trigger
  compression_keep_recent_messages: 4  # trailing turns kept verbatim on compression
  # Memory V2 — session-end policy gate
  consolidation_importance_floor: 0.3        # drop candidates below this before write
  consolidation_dedup_similarity_floor: 0.92 # episodic dup if cosine ≥ this (same subject)
  # Memory V2 — ACT-R activation (episodic recall rank + consolidation eligibility)
  activation_w_importance: 1.0
  activation_w_access: 0.5             # "use-it": ln(1+access_count) reinforcement
  activation_w_age: 0.3                # "lose-it": ln(1+age_days) decay
  # Memory V2 — monthly consolidation (forgetting)
  consolidation_survival_threshold: 0.5      # raws below this activation pruned post-summary
  consolidation_min_cluster_size: 2          # skip summarising clusters smaller than this

bus:
  stream_prefix: bus
  shard_count: 64                      # 1..4096; per-shard serial ordering
  consumer_group: workers
  debounce_ms: 500                     # message-burst merge window

rag:
  # Cascade confidence gate (relative-margin + low floor, per stage).
  # A stage exits when top-1 >= floor AND (top1-top2)/top1 >= rel_margin.
  # Defaults below are calibrated on the 337-QA eval set (Youden's J).
  # Re-run `python -m backend.eval.retrieval.calibrate --write` after a
  # model/corpus change — don't hand-pick.
  stage1_floor: 0.70                   # stage-1 dense cosine absolute floor
  stage1_rel_margin: 0.0               # stage-1 separation (floor alone wins here)
  stage2_floor: 0.0                    # stage-2 hybrid: no floor (unnormalized scale)
  stage2_rel_margin: 0.04              # stage-2 min relative separation
  min_k: 3                             # min results before a stage may exit
  dense_weight: 0.5                    # hybrid dense branch weight
  bm25_weight: 0.5                     # hybrid BM25 branch weight

milvus:
  uri: http://localhost:19530
  collection_name: knowledge_chunks
  # token is a secret → .env

skill:
  internal_repo_path: ""               # dir of markdown SOPs; empty disables

mcp:
  # JSON array of MCP server configs. Empty "[]" disables MCP (no extra tools).
  # Each entry: {id, transport(stdio|http|sse), url|command, auth_type, ...}.
  # For OAuth: auth_type=oauth + oauth_token_url/client_id/client_secret/scope.
  # Secrets (api_key, oauth_client_secret) are better injected via MCP_SERVERS_JSON
  # env var than committed here. Example for the local mock server:
  #   [{"id":"shop","transport":"http","url":"http://localhost:9100/mcp",
  #     "auth_type":"oauth","oauth_token_url":"http://localhost:9100/token",
  #     "oauth_client_id":"agent","oauth_client_secret":"secret",
  #     "write_tools":["create_handoff_ticket"]}]
  servers_json: "[]"
  cache_l1_ttl_seconds: 300            # in-memory tool-result cache TTL
  cache_l2_ttl_seconds: 86400          # Redis tool-result cache TTL
  call_timeout_seconds: 30             # per tool-call timeout

wecom_aibot:
  heartbeat_seconds: 30
  outbound_pubsub_channel: wecom_aibot:outbound
  # ws_url / bot_id / secret are secrets → .env

langsmith:
  tracing: false
  project: v-main
  endpoint: https://api.smith.langchain.com
  # api_key is a secret → .env
